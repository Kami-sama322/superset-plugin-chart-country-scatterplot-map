services:
  superset:
    build:
      context: .
      dockerfile: Dockerfile
    image: superset_with_country_scatterplot_map:6.1.0
    ports:
      - "8088:8088"
    environment:
      - SUPERSET_SECRET_KEY=your_secure_random_string_here
      - SUPERSET_CONFIG_PATH=/app/pythonpath/superset_config.py
    volumes:
      - ./superset_config.py:/app/pythonpath/superset_config.py:ro
      - superset_home:/app
    user: "root"
    command: >
      sh -c "
      if [ ! -f /app/superset.db ]; then
        echo '=== Первый запуск: Инициализация БД и создание админа ===' &&
        superset db upgrade &&
        superset fab create-admin --username admin --firstname Admin --lastname User --email admin@example.com --password admin &&
        superset init &&
        echo '=== Загрузка примеров данных (может занять 1-3 минуты) ===' &&
        superset load-examples;
      else
        echo '=== БД уже существует, пропускаем инициализацию и примеры ===';
      fi &&
      echo '=== Запуск веб-сервера Apache Superset ===' &&
      exec superset run -p 8088 -h 0.0.0.0 --with-threads
      "

volumes:
  superset_home:
